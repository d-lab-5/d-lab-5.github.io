# Build docs.dlab5.net from sites.json and publish it: every night, on a push
# to main, or at once with "Run workflow".
#
# A product's build runs that product's own code, so each runs in a job of its
# own, with no token and only its own cache, and hands over only its folder.
# The assemble job runs no product code: it takes from each folder only what
# is safe and puts it under that product's path. A product that fails keeps
# its last good copy (from its cache), and the run is marked failed.
#
# Actions are pinned to commit SHAs; the comment names the release.
name: docs.dlab5.net

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: m
        run: echo "matrix=$(node scripts/build.mjs --matrix)" >> "$GITHUB_OUTPUT"

  product:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: product-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: product-${{ matrix.part }}-
      - id: build
        continue-on-error: true
        run: node scripts/build.mjs --only "${{ matrix.product }}" --out out --cache cache
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && steps.build.outcome == 'success'
        with:
          path: cache
          key: product-${{ matrix.part }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('out/site.json') != ''
        with:
          name: docs-part-${{ matrix.part }}
          path: out
          include-hidden-files: true
          retention-days: 1
      - if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::${{ matrix.product }} did not build; see the build step"
          exit 1

  assemble:
    needs: [plan, product]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      outcome: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # each product's artifact by its own name into its own folder: one
      # artifact can never land in another product's place (and a pattern
      # download unpacks a lone artifact straight into the target)
      - name: Download each product's folder
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          for part in $(jq -r '.[].part' <<< "$MATRIX"); do
            [[ "$part" =~ ^[a-z0-9-]+__[a-z0-9-]+$ ]] || { echo "::error::bad part name $part"; exit 1; }
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "docs-part-$part" -D "parts/$part" \
              || echo "::warning::no folder from $part"
          done
      - id: site
        continue-on-error: true
        run: node scripts/build.mjs --assemble parts --out _site
      - run: node scripts/links.mjs _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: assemble
    if: always() && needs.assemble.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
